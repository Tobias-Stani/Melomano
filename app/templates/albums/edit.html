{% extends "base.html" %}
{% block title %}Editar — {{ album.artist }} — {{ album.title }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">

    <a href="/album/{{ album.id }}" class="inline-flex items-center gap-1.5 text-sm text-ink-400 hover:text-ink-700 mb-6 transition-all">
        ← Volver al album
    </a>

    <h1 class="font-serif text-3xl font-700 text-ink-800 tracking-tight mb-8">Editar disco</h1>

    <form action="/album/{{ album.id }}/edit" method="POST" class="space-y-5">

        <!-- Artista y Titulo -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs uppercase tracking-widest text-ink-400 mb-2">Artista *</label>
                <input type="text" name="artist" required value="{{ album.artist }}"
                    class="w-full bg-white border border-cream-200 rounded-xl px-4 py-2.5 text-sm text-ink-800 focus:outline-none focus:ring-2 focus:ring-cream-400" />
            </div>
            <div>
                <label class="block text-xs uppercase tracking-widest text-ink-400 mb-2">Año</label>
                <input type="number" name="year" value="{{ album.year or '' }}" min="1900" max="2099"
                    class="w-full bg-white border border-cream-200 rounded-xl px-4 py-2.5 text-sm text-ink-800 focus:outline-none focus:ring-2 focus:ring-cream-400" />
            </div>
        </div>

        <div>
            <label class="block text-xs uppercase tracking-widest text-ink-400 mb-2">Titulo *</label>
            <input type="text" name="title" required value="{{ album.title }}"
                class="w-full bg-white border border-cream-200 rounded-xl px-4 py-2.5 text-sm text-ink-800 focus:outline-none focus:ring-2 focus:ring-cream-400" />
        </div>

        <!-- Genero, Sello, Formato -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
                <label class="block text-xs uppercase tracking-widest text-ink-400 mb-2">Genero</label>
                <input type="text" name="genre" value="{{ album.genre or '' }}" placeholder="Ej: Rock"
                    class="w-full bg-white border border-cream-200 rounded-xl px-4 py-2.5 text-sm text-ink-800 focus:outline-none focus:ring-2 focus:ring-cream-400" />
            </div>
            <div>
                <label class="block text-xs uppercase tracking-widest text-ink-400 mb-2">Sello</label>
                <input type="text" name="label" value="{{ album.label or '' }}" placeholder="Ej: Columbia"
                    class="w-full bg-white border border-cream-200 rounded-xl px-4 py-2.5 text-sm text-ink-800 focus:outline-none focus:ring-2 focus:ring-cream-400" />
            </div>
            <div>
                <label class="block text-xs uppercase tracking-widest text-ink-400 mb-2">Formato</label>
                <div class="flex gap-2">
                    <select id="formatSelect" name="format_type"
                        class="flex-1 bg-white border border-cream-200 rounded-xl px-4 py-2.5 text-sm text-ink-800 focus:outline-none focus:ring-2 focus:ring-cream-400">
                        <option value="">— Sin especificar —</option>
                        {% for ft in format_types %}
                        <option value="{{ ft.name }}" {% if album.format_type == ft.name %}selected{% endif %}>{{ ft.name }}</option>
                        {% endfor %}
                    </select>
                    <button type="button" onclick="openAddFormat()"
                        class="px-3 py-2 bg-cream-200 text-ink-600 rounded-xl text-lg font-300 hover:bg-cream-300 transition-all leading-none">+</button>
                </div>
            </div>
        </div>

        <!-- URL portada -->
        <div>
            <label class="block text-xs uppercase tracking-widest text-ink-400 mb-2">URL de portada</label>
            <input type="url" name="cover_url" value="{{ album.cover_url or '' }}" placeholder="https://..."
                class="w-full bg-white border border-cream-200 rounded-xl px-4 py-2.5 text-sm text-ink-800 focus:outline-none focus:ring-2 focus:ring-cream-400" />
        </div>

        <hr class="border-cream-200" />

        <!-- Estado -->
        <div>
            <p class="text-xs uppercase tracking-widest text-ink-400 mb-3">Estado</p>
            <div class="flex gap-6 flex-wrap">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" name="owned" {% if album.owned %}checked{% endif %}
                        class="rounded border-cream-300 text-ink-800 focus:ring-cream-400" />
                    <span class="text-sm text-ink-600">💿 Lo tengo</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" name="listened" {% if album.listened %}checked{% endif %}
                        class="rounded border-cream-300 text-ink-800 focus:ring-cream-400" />
                    <span class="text-sm text-ink-600">✓ Lo escuche</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" name="wishlist" {% if album.wishlist %}checked{% endif %}
                        class="rounded border-cream-300 text-ink-800 focus:ring-cream-400" />
                    <span class="text-sm text-ink-600">🔖 Lo quiero</span>
                </label>
            </div>
        </div>

        <!-- Score -->
        <div>
            <label class="block text-xs uppercase tracking-widest text-ink-400 mb-3">
                Nota: <span id="scoreVal" class="font-serif text-2xl font-700 text-ink-800 ml-2">{{ album.score or 5 }}</span>/10
            </label>
            <input type="range" name="score" id="scoreRange" min="1" max="10" value="{{ album.score or 5 }}"
                class="w-full h-1.5 rounded-full appearance-none cursor-pointer"
                style="-webkit-appearance:none;background:#e4ceac;"
                oninput="document.getElementById('scoreVal').textContent=this.value" />
        </div>

        <!-- Resena -->
        <div>
            <label class="block text-xs uppercase tracking-widest text-ink-400 mb-2">Resena personal</label>
            <textarea name="review" rows="3" placeholder="Que te parece este disco..."
                class="w-full bg-white border border-cream-200 rounded-xl px-4 py-3 text-ink-800 text-sm focus:outline-none focus:ring-2 focus:ring-cream-400 resize-none">{{ album.review or '' }}</textarea>
        </div>

        <div class="flex gap-3 pt-2">
            <button type="submit"
                class="px-8 py-2.5 bg-ink-800 text-cream-50 rounded-xl text-sm font-600 hover:bg-ink-700 transition-all">
                Guardar cambios
            </button>
            <a href="/album/{{ album.id }}"
                class="px-6 py-2.5 border border-cream-300 text-ink-400 rounded-xl text-sm hover:bg-cream-200 transition-all">
                Cancelar
            </a>
        </div>
    </form>
</div>

<!-- Mini modal agregar formato -->
<div id="addFormatModal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
    <div class="bg-cream-50 rounded-2xl p-5 w-full max-w-xs shadow-xl">
        <p class="font-serif text-base font-600 text-ink-800 mb-3">Nuevo formato</p>
        <div class="flex gap-2">
            <input id="newFormatName" type="text" placeholder="Ej: Vinyl, CD..."
                class="flex-1 bg-white border border-cream-200 rounded-xl px-3 py-2 text-sm text-ink-800 focus:outline-none focus:ring-2 focus:ring-cream-400" />
            <button type="button" onclick="saveNewFormat()"
                class="px-4 py-2 bg-ink-800 text-cream-50 rounded-xl text-sm hover:bg-ink-700 transition-all">OK</button>
        </div>
        <button type="button" onclick="closeAddFormat()"
            class="mt-3 text-xs text-ink-300 hover:text-ink-500 transition-all">Cancelar</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function openAddFormat() {
    document.getElementById('addFormatModal').classList.remove('hidden');
    document.getElementById('newFormatName').focus();
}
function closeAddFormat() {
    document.getElementById('addFormatModal').classList.add('hidden');
    document.getElementById('newFormatName').value = '';
}
async function saveNewFormat() {
    const name = document.getElementById('newFormatName').value.trim();
    if (!name) return;
    const form = new FormData();
    form.append('name', name);
    const resp = await fetch('/formatos', { method: 'POST', body: form, redirect: 'manual' });
    const sel = document.getElementById('formatSelect');
    const opt = document.createElement('option');
    opt.value = name; opt.textContent = name; opt.selected = true;
    sel.appendChild(opt);
    closeAddFormat();
}
document.getElementById('newFormatName').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); saveNewFormat(); }
    if (e.key === 'Escape') closeAddFormat();
});
</script>
{% endblock %}
