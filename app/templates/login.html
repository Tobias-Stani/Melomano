<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Melomano — Ingresar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{cream:{50:'#fdfaf5',100:'#f9f3e8',200:'#f0e6d0',300:'#e4ceac'},ink:{200:'#ccc9c1',300:'#aaa69b',400:'#888278',700:'#3a3733',800:'#252320'}},fontFamily:{serif:['"Playfair Display"','Georgia','serif'],sans:['"Inter"','system-ui','sans-serif']}}}}</script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif;background-color:#f9f3e8;}</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm">
        <div class="text-center mb-10">
            <span class="text-5xl">🎵</span>
            <h1 class="font-serif text-3xl font-700 text-ink-800 mt-3 tracking-tight">Melomano</h1>
            <p class="text-ink-400 text-sm mt-1">Tu universo musical personal</p>
        </div>
        <div class="bg-cream-50 border border-cream-200 rounded-2xl p-8 shadow-sm">
            <form action="/login" method="POST" class="space-y-5">
                <input type="hidden" name="next" value="{{ next }}" />
                <div>
                    <label class="block text-xs font-600 uppercase tracking-widest text-ink-400 mb-2">Usuario</label>
                    <input type="text" name="username" autofocus autocomplete="username"
                        class="w-full bg-white border border-cream-200 rounded-xl px-4 py-3 text-ink-800 text-sm focus:outline-none focus:ring-2 focus:ring-cream-400 transition-all" required />
                </div>
                <div>
                    <label class="block text-xs font-600 uppercase tracking-widest text-ink-400 mb-2">Contrasena</label>
                    <input type="password" name="password" autocomplete="current-password"
                        class="w-full bg-white border border-cream-200 rounded-xl px-4 py-3 text-ink-800 text-sm focus:outline-none focus:ring-2 focus:ring-cream-400 transition-all" required />
                </div>
                {% if error %}
                <p class="text-red-400 text-sm text-center bg-red-50 border border-red-100 rounded-lg py-2 px-3">{{ error }}</p>
                {% endif %}
                <button type="submit" class="w-full bg-ink-800 hover:bg-ink-700 text-cream-50 font-500 text-sm py-3.5 rounded-xl transition-all tracking-wide">
                    Ingresar
                </button>
            </form>
        </div>
    </div>
</body>
</html>
