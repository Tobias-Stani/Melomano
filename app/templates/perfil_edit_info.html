{% extends "base.html" %}
{% block title %}Editar perfil — Melomano{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
    <a href="/perfil/{{ profile.username }}" class="inline-flex items-center gap-1.5 text-sm text-ink-400 hover:text-ink-700 mb-6 transition-all">
        ← Volver al perfil
    </a>
    <h1 class="font-serif text-3xl font-700 text-ink-800 tracking-tight mb-8">Editar perfil</h1>

    <form action="/perfil/editar" method="POST" enctype="multipart/form-data" class="space-y-6">

        <!-- Avatar actual -->
        <div class="flex items-center gap-4">
            {% if profile.avatar %}
            <img src="{{ profile.avatar }}" alt="avatar" class="w-16 h-16 rounded-full object-cover border border-cream-200" />
            {% else %}
            <div class="w-16 h-16 rounded-full bg-cream-300 flex items-center justify-center text-2xl">🎵</div>
            {% endif %}
            <div class="flex-1">
                <label class="block text-xs uppercase tracking-widest text-ink-400 mb-1">Foto de perfil</label>
                <input type="file" name="avatar" accept="image/*"
                    class="w-full text-sm text-ink-600 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-ink-800 file:text-cream-50 file:text-xs file:cursor-pointer hover:file:bg-ink-700" />
            </div>
        </div>

        <div>
            <label class="block text-xs uppercase tracking-widest text-ink-400 mb-1">Nombre a mostrar</label>
            <input type="text" name="display_name" value="{{ profile.display_name or '' }}" placeholder="{{ profile.username }}"
                class="w-full bg-white border border-cream-200 rounded-xl px-4 py-2.5 text-sm text-ink-800 focus:outline-none focus:ring-2 focus:ring-cream-400" />
        </div>

        <div>
            <label class="block text-xs uppercase tracking-widest text-ink-400 mb-1">Bio</label>
            <textarea name="bio" rows="3" placeholder="Contá algo sobre vos y tu gusto musical..."
                class="w-full bg-white border border-cream-200 rounded-xl px-4 py-2.5 text-sm text-ink-800 focus:outline-none focus:ring-2 focus:ring-cream-400 resize-none">{{ profile.bio or '' }}</textarea>
        </div>

        <div class="flex gap-3">
            <button type="submit"
                class="px-6 py-2.5 bg-ink-800 text-cream-50 rounded-xl text-sm font-600 hover:bg-ink-700 transition-all">
                Guardar
            </button>
            <a href="/perfil/{{ profile.username }}"
                class="px-6 py-2.5 border border-cream-300 text-ink-400 rounded-xl text-sm hover:bg-cream-200 transition-all">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
