{% extends "base.html" %}
{% block title %}Formatos — Melomano{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
    <a href="/" class="inline-flex items-center gap-1.5 text-sm text-ink-400 hover:text-ink-700 mb-6 transition-all">
        ← Volver
    </a>
    <h1 class="font-serif text-3xl font-700 text-ink-800 tracking-tight mb-8">Formatos de disco</h1>

    <!-- Agregar -->
    <form action="/formatos" method="POST" class="flex gap-2 mb-8">
        <input type="text" name="name" required placeholder="Ej: Vinyl, CD, Cassette..."
            class="flex-1 bg-white border border-cream-200 rounded-xl px-4 py-2.5 text-sm text-ink-800 focus:outline-none focus:ring-2 focus:ring-cream-400" />
        <button type="submit"
            class="px-5 py-2.5 bg-ink-800 text-cream-50 rounded-xl text-sm font-600 hover:bg-ink-700 transition-all">
            Agregar
        </button>
    </form>

    <!-- Lista -->
    {% if formats %}
    <div class="space-y-2">
        {% for fmt in formats %}
        <div class="flex items-center justify-between bg-cream-100 border border-cream-200 rounded-xl px-4 py-3">
            <span class="text-sm font-500 text-ink-700">{{ fmt.name }}</span>
            <a href="/formatos/{{ fmt.id }}/delete"
                onclick="return confirm('Eliminar {{ fmt.name }}?')"
                class="text-xs text-ink-300 hover:text-red-400 transition-all">
                Eliminar
            </a>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <p class="text-sm text-ink-300 text-center py-8">No hay formatos todavía. Agregá uno arriba.</p>
    {% endif %}
</div>
{% endblock %}
