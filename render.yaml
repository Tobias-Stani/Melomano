services:
  - type: web
    name: melomano
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    branch: main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: melomano-db
          property: connectionString
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DISCOGS_TOKEN
        sync: false
      - key: DISCOGS_USERNAME
        sync: false

databases:
  - name: melomano-db
    plan: free
