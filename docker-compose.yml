services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: melomano
      POSTGRES_PASSWORD: melomano
      POSTGRES_DB: melomano
    ports:
      # Exposes Postgres to the host (127.0.0.1 only) so the Iteguito AI
      # stack (a separate docker-compose project) can reach it as a
      # read-only-configured tenant CRM. Not exposed to 0.0.0.0.
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melomano"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      # The Dockerfile's uvicorn defaults to port 8000 (no PORT env var set
      # here), so the host mapping must match 8000, not 4000.
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./app:/app/app

volumes:
  postgres_data:
