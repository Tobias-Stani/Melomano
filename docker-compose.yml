services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: melomano
      POSTGRES_PASSWORD: melomano
      POSTGRES_DB: melomano
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melomano"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
